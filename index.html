    <!--
      HERO IMAGE — img réelle dans le HTML initial (hors React root).

      Pourquoi cette img et pas seulement le <link rel="preload"> ?
      ─────────────────────────────────────────────────────────────
      Le preload <link> peut échouer à produire un cache HIT si :
        • Cloudinary renvoie Vary:Accept → différence de headers entre preload et img
        • La sélection du srcset diffère légèrement entre les deux contextes

      Cette <img> est dans le HTML INITIAL → Chrome la télécharge dès le parse
      (T≈75ms), AVANT que JavaScript évalue (T≈220ms) et AVANT que React rende (T≈1700ms).
      Quand React ajoute la même <img src="f_webp,q_30,w_850,c_limit/..."> au DOM,
      le navigateur trouve l'image en mémoire cache → cache HIT → LCP = FCP.

      Règles de non-impact :
        • opacity:0          → invisible (mais téléchargée — Chrome charge les ressources de tout
                               élément non display:none, opacity:0 inclus)
        • position:fixed     → hors du flux, zéro CLS
        • pointer-events:none → non interactif
        • z-index:-9999      → derrière tout
        • aria-hidden="true" → ignorée par les lecteurs d'écran
        • alt=""             → image décorative au sens WCAG

      ⚠️  URLs DOIVENT correspondre EXACTEMENT à celles de Home.tsx :
            src  → getOptimizedCldUrl(IMAGES.heroHome, 1200, 30, 'webp')
            srcset → cldSrcSet(IMAGES.heroHome, [400, 850, 1200, 1920], 30, 'webp')
          Toute divergence de format/qualité/largeur = cache MISS = LCP inchangé.
    -->

      src="https://res.cloudinary.com/dc9xmxpvv/image/upload/f_webp,q_30,w_1200,c_limit/v1773950694/nettoyage-vitres-marseille-cannes-allentours_-_01_qifmli.jpg"
